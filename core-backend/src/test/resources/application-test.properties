spring.datasource.url=jdbc:h2:mem:aegissight;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true

aegissight.jwt.secret=test-jwt-secret-with-at-least-32-bytes!!
aegissight.jwt.expiration-seconds=86400
aegissight.cors.allowed-origins=http://localhost:3000,http://localhost:5173
aegissight.app.version=1.0.0-test
aegissight.app.service-name=aegissight-backend
