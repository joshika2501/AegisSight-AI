# ==================================================
# AegisSight AI Configuration
# ==================================================

project:
  name: AegisSight AI
  version: 1.0.0

device:
  type: auto

paths:
  output: outputs/
  logs: logs/

detector:
  model: yolo11x.pt
  confidence: 0.45
  iou: 0.50
  max_detections: 300

embedding:
  model: dinov2_vitb14

tracking:
  max_age: 30
  min_hits: 3
  iou_threshold: 0.30

logging:
  level: INFO